name: Project verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-local-password
          POSTGRES_DB: learngraph_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d learngraph_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:test-only-local-password@127.0.0.1:5432/learngraph_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.23"
          enable-cache: false
      - run: uv sync --frozen --group dev --python 3.12
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen python scripts/check_content.py
      - run: uv run --frozen python -m scripts.freeze_phase0
      - run: uv run --frozen python -m scripts.check_phase0
      - run: uv run --frozen python -m scripts.build_full_curriculum
      - run: uv run --frozen python -m scripts.check_full_curriculum
      - run: uv run --frozen python -m scripts.generate_browser_contracts --check
      - run: uv run --frozen pytest -q
      - run: uv run --frozen python -m scripts.evaluate --check ../evaluation/results/phase4-regression-v1
      - run: uv run --frozen python -m scripts.freeze_full_audit
      - run: uv run --frozen python -m scripts.evaluate_full --check ../evaluation/results/phase5-full-v1

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.18.0"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.23"
          enable-cache: false
      - run: uv sync --project ../backend --frozen --group dev --python 3.12
      - run: node ../contracts/check-hashes.mjs
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
