[project]
name = "learngraph-ai-api"
version = "0.1.0"
description = "Bounded, database-backed LearnGraph AI deployment feasibility slice"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.165.0",
  "pydantic==2.14.4",
  "psycopg[binary,pool]==3.3.9",
  "uvicorn==0.49.0",
  "python-dotenv==1.2.2",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.3", "ruff==0.15.7"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires an isolated PostgreSQL test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Original learner-facing prose and code samples retain readable literal boundaries.
"scripts/full_content.py" = ["E501"]
"scripts/build_full_curriculum.py" = ["E501"]
